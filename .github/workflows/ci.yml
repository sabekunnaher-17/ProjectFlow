name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test tests/ProjectFlow.UnitTests --no-build --configuration Release
      - run: dotnet test tests/ProjectFlow.IntegrationTests --no-build --configuration Release
  sql-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.402
      - name: Start isolated SQL Server (runner-only; generated credential)
        shell: bash
        run: |
          sql_password="Pf!$(openssl rand -hex 24)"
          echo "::add-mask::$sql_password"
          docker run -d --name projectflow-sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$sql_password" -p 127.0.0.1:14333:1433 mcr.microsoft.com/mssql/server:2022-latest
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec -e "SQLCMDPASSWORD=$sql_password" projectflow-sql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' >/dev/null 2>&1; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          echo "PROJECTFLOW_TEST_SQL_SERVER=Server=127.0.0.1,14333;Database=master;User Id=sa;Password=$sql_password;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release
      - name: Install browser on disposable CI runner only
        run: pwsh tests/ProjectFlow.IntegrationTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test tests/ProjectFlow.IntegrationTests --no-build --configuration Release
        env:
          PROJECTFLOW_BROWSER_TESTS: "1"
          PROJECTFLOW_SCREENSHOTS: ${{ runner.temp }}/projectflow-screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: projectflow-browser-screenshots
          path: ${{ runner.temp }}/projectflow-screenshots
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this runner's disposable container
        if: always()
        run: docker rm -f projectflow-sql
